<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>projects</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>
    <body>
        <div class="header-image"></div>
        <div class="wrapper">
            <div class="nav-bar" id="nav-bar"></div>
            <div class="main-container">
                <div class="left-column">
                    <h2>Projects</h2>
                    <h3>Attention Control for Text-to-Image Alignment</h3>
                    <img src="images/paper1_page.png" alt="feynman_diagram" class="paper-image">
                    
                    <div>In this project, we improved the faithfulness of text-to-image diffusion models using the inherent (and neglected) information in the text encoder of the model.
                        
                    </div>
                    <div class="buttons">
                        <a href="https://arxiv.org/pdf/2411.15236" target="_blank">Paper PDF</a>
                        <a href="https://github.com/erfanili/stable_diffusion_temperature_control" target="_blank">GitHub Link</a>
                    </div>
                </div>
                <div class="right-column" id="right-column"></div>        
            </div>
        </div>
        <script>
            function loadHTML(elementId, filePath) {
                const element = document.getElementById(elementId);
                fetch(filePath)
                    .then(response => response.text())
                    .then(data => {
                        element.innerHTML = data;
                    })
                    .catch(error => console.error('Error loading HTML:', error));
            }

            document.addEventListener('DOMContentLoaded', () => {
                loadHTML('nav-bar', 'nav-bar.html');
                loadHTML('right-column', 'right-column.html');
            });
        </script>
    </body>
</html>
